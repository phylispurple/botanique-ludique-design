    <!-- Mesure d'audience Umami Cloud (offre gratuite) : sans cookies, pas de consentement requis.
         data-domains : ne compte que le vrai site (ni localhost, ni les aperçus Netlify).
         Les conversions (formulaires, CTA blog) passent par src/lib/analytics.ts. -->
    <!-- Exclure ses propres visites : ouvrir une fois botaniqueludique.com/?moi sur chaque appareil
         (méthode officielle Umami, réglage par navigateur). /?moi=off pour être de nouveau comptée. -->
    <script>
      (function () {
        try {
          var p = new URLSearchParams(location.search);
          if (!p.has("moi")) return;
          if (p.get("moi") === "off") {
            localStorage.removeItem("umami.disabled");
            alert("Vos visites sont de nouveau comptées dans Umami sur ce navigateur.");
          } else {
            localStorage.setItem("umami.disabled", "1");
            alert("C'est noté : vos visites ne seront plus comptées dans Umami sur ce navigateur.");
          }
          p.delete("moi");
          var q = p.toString();
          history.replaceState(null, "", location.pathname + (q ? "?" + q : "") + location.hash);
        } catch (e) {}
      })();
    </script>
    <!-- Chargement d'Umami, sauf pour :
         - les navigateurs automatisés qui se déclarent comme tels (navigator.webdriver) ;
         - les appareils réglés sur un fuseau horaire des États-Unis (beaucoup de robots,
           et pas la clientèle visée). Les DOM-TOM et le Québec restent comptés. -->
    <script>
      (function () {
        try {
          if (navigator.webdriver) return;
          var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || "");
          var US = /^(US\/|Pacific\/Honolulu|America\/(New_York|Chicago|Denver|Los_Angeles|Phoenix|Anchorage|Detroit|Boise|Juneau|Sitka|Nome|Adak|Metlakatla|Yakutat|Menominee|Indiana\/|Kentucky\/|North_Dakota\/))/;
          if (US.test(tz)) return;
          var s = document.createElement("script");
          s.defer = true;
          s.src = "https://cloud.umami.is/script.js";
          s.setAttribute("data-website-id", "58fcf240-0295-4576-9a40-e42240e3c564");
          s.setAttribute("data-domains", "botaniqueludique.com");
          document.head.appendChild(s);
        } catch (e) {}
      })();
    </script>
